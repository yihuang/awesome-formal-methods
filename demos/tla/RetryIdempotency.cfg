\* TLC model configuration for RetryIdempotency.tla
\*
\* Usage: open RetryIdempotency.tla in the TLA+ Toolbox (or the VS Code TLA+
\* extension), create a new model, and paste/point this configuration at it.
\*
\* With Id = {"r1"} this is already enough to produce the counterexample.
\* Widen Id to add more requests.

SPECIFICATION Spec

CONSTANT Id = {"r1"}

INVARIANT TypeOK
INVARIANT AtMostOnce

\* To check liveness you must additionally enable temporal-property checking in
\* the model and add a fairness specification, e.g.:
\*   PROPERTY EventualAck
\*   (with Spec defined as Init /\ [][Next]_vars /\ WF_vars(Next))
